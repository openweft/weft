version: '3'

vars:
  CGO_LDFLAGS: "-Xlinker -no_warn_duplicate_libraries"

tasks:
  build:
    desc: "Build weft daemon into ./bin/weft"
    env:
      CGO_LDFLAGS: "{{.CGO_LDFLAGS}}"
    cmds:
      - mkdir -p ./bin
      - go build -v -mod=vendor -gcflags "github.com/progrium/darwinkit/...=-N -l" -o ./bin/weft ./cmd/weft
      - codesign --entitlements ./vz.entitlements -s - ./bin/weft

  test:
    desc: "Run tests (imagestore)"
    env:
      CGO_LDFLAGS: "{{.CGO_LDFLAGS}}"
    cmds:
      - go test -mod=vendor -tags darwin -cover ./...

  run:
    desc: "Run the weft agent (all-in-one) with the local example config"
    cmds:
      - ./bin/weft agent --config-dir .mock/hcl

  lint:
    desc: "Vet the package"
    cmds:
      - go vet -mod=vendor -tags darwin ./...

  perf:bringup:
    desc: "Bring up N microVMs and record per-phase timings (CSV). Vars: N=10|100|1000"
    cmds:
      - ./scripts/perf/bring-up-N.sh {{.N}}
    requires:
      vars: [N]

  perf:mesh:
    desc: "Measure mesh fanout from a fresh microVM to N peers (P50/P95/P99)"
    cmds:
      - ./scripts/perf/mesh-fanout.sh {{.N}}
    requires:
      vars: [N]

  perf:etcd-write:
    desc: "Stress weft's etcd writes and report req/s + P99 latency"
    cmds:
      - ./scripts/perf/etcd-write-rate.sh

  integration:3host:
    desc: "Run the 3-host integration harness against the local Tart cluster. Override the IP prefix via WEFT_INTEGRATION_HOSTS_PREFIX (default 192.168.64). See tests/integration/3host/README.md."
    env:
      WEFT_INTEGRATION_HOSTS_PREFIX: '{{.WEFT_INTEGRATION_HOSTS_PREFIX | default "192.168.64"}}'
    cmds:
      - go test -tags integration -timeout 30m ./tests/integration/3host/...
