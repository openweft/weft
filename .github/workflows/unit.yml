name: unit

# `go test` on every package that has tests.
#
# Until now it ran on four: integration-linux.yml drives floatingipnat,
# floatingipl2, portsec and portqos with -tags=integration, and nothing else
# in this repository ran tests at all. 83 packages have them.
#
# That is not a small gap in coverage. A test suite nobody runs cannot report
# that it has gone stale, so the staleness accumulates in silence -- which is
# exactly what happened to cmd/weft/plugin, whose tests still drive
# --state-dir and --catalogue, both removed when 98e827b01 moved the plugin
# catalogue onto the agent. Nine tests describe a CLI that no longer exists,
# and nothing could say so.
#
# cmd/weft/plugin was excluded here BY NAME until 2026-09-23: its tests
# still drove --state-dir and --catalogue, removed when 98e827b01 moved the
# plugin catalogue onto the agent. They now describe the current CLI and run
# with everything else. See issue #23.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: go test (every package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # ⛔ TestRunAttestationHandshake_RealSwtpm HAS NEVER RUN. It drives a real
      # software TPM through go-tpm2/devtpm, enrols the EK, quotes PCRs 0–7 and
      # checks the admitted AK Name — and it skips itself when swtpm(8) is not
      # on PATH, which it never was. A green lane over a skipped judge looks
      # exactly like a green lane over a passing one.
      #
      # Found by go-fleettools/judgescan. It is the only tool in this
      # repository's tests that the workflows never installed, and the only one
      # reached from a Test rather than from a benchmark.
      - name: install swtpm, the software TPM the attestation test drives
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swtpm swtpm-tools

      # -short: the slow paths are gated behind testing.Short(), and the
      # integration ones behind -tags=integration, which this job does not set.
      #
      # xargs rather than an unquoted $(...): word splitting is a shell detail
      # this should not depend on. Checking the same line locally under zsh
      # passed the whole list as ONE argument and reported a failure that did
      # not exist.
      - name: test
        run: |
          set -euo pipefail
          go list ./... > "$RUNNER_TEMP/pkgs.txt"
          echo "packages under test: $(wc -l < "$RUNNER_TEMP/pkgs.txt")"
          xargs go test -short -timeout 20m < "$RUNNER_TEMP/pkgs.txt"

      # A skip is not a pass, and the summary line cannot tell them apart. If
      # swtpm stops being installed, or the test starts skipping for some other
      # reason, this says so instead of going quietly green.
      - name: the attestation handshake must have run
        run: |
          set -euo pipefail
          out=$(go test -run TestRunAttestationHandshake_RealSwtpm -v -count=1 ./agent/ 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          case "$out" in
            *"--- SKIP"*) echo "::error::the swtpm handshake skipped; the software TPM is not there"; exit 1 ;;
            *"--- PASS"*) ;;
            *) echo "::error::the swtpm handshake neither passed nor skipped"; exit 1 ;;
          esac
