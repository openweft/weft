name: release

# Builds the weft CLI for the OS×arch matrix weft-agent ships on,
# publishes the binaries as a GitHub Release, and pushes a multi-arch
# OCI image to ghcr.io so `weft up` can pull it alongside drivers and
# the kernel.
#
# Trigger policy: workflow_dispatch + tag `v*` only, never push:main
# (per feedback_no_autopublish_dev). Memory project_driver_plugins
# pins CGO_ENABLED=0 across the matrix — the macOS hyperviser is in
# weft-driver-vz, not weft itself.
#
# Supply-chain attestations: each tarball + per-arch image gets an
# SPDX 2.3 JSON SBOM (Syft) cosign-attested as `spdxjson`, plus a
# SLSA L3 provenance via slsa-framework/slsa-github-generator. See
# docs/operations/cosign-verify.md for the verifier commands.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (default: refs/tags/<current>)"
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/weft

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # SOURCE_DATE_EPOCH = commit timestamp of the build ref.
          # Canonical reproducible-builds.org convention ; combined with
          # -trimpath + -buildvcs=false + -buildid= below it pins every
          # source of non-determinism Go itself emits.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "${GITHUB_SHA}")"
          export SOURCE_DATE_EPOCH
          out="dist/${{ matrix.goos }}-${{ matrix.goarch }}/weft"
          mkdir -p "$(dirname "$out")"
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -buildid= -X main.version=${{ github.ref_name }}" \
            -o "$out" ./cmd/weft

      - uses: actions/upload-artifact@v7
        with:
          name: weft-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}-${{ matrix.goarch }}/weft

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      # Surfaces the SHA256SUMS hash so the SLSA generator job below
      # can pin provenance to the exact bytes the Release will ship.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: false

      - name: stage release assets
        # GitHub Release expects flat files. Repackage each per-OS/arch
        # binary as a tar.gz alongside a SHA256SUMS file.
        #
        # Reproducibility: --mtime pins entry mtimes to SOURCE_DATE_EPOCH,
        # --owner/--group/--numeric-owner pin metadata, and `gzip -n`
        # strips the gzip header timestamp+filename. Without those flags
        # `tar | gzip` embeds the current wall-clock and the resulting
        # archive sha256 changes on every run.
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "${GITHUB_SHA}")"
          export SOURCE_DATE_EPOCH
          mkdir -p stage
          tag="${{ github.ref_name }}"
          for d in dist/weft-*; do
            name=$(basename "$d")
            tar \
              --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -C "$d" -cf - weft \
              | gzip -n -9 > "stage/${name}_${tag}.tar.gz"
          done
          ( cd stage && sha256sum *.tar.gz > SHA256SUMS )

      - uses: anchore/sbom-action/download-syft@v0
        # Pin syft once for the per-tarball loop below. The action
        # caches the binary on the runner so subsequent invocations
        # are no-ops.

      - name: generate SBOMs (SPDX 2.3 JSON, per tarball)
        # One SBOM per per-OS/arch tarball. We scan the per-arch
        # build directory (which holds the single `weft` binary) so
        # the SBOM enumerates the Go modules baked into that arch.
        run: |
          set -euo pipefail
          for d in dist/weft-*; do
            name=$(basename "$d")
            syft scan "dir:${d}" -o spdx-json="stage/${name}_${{ github.ref_name }}.tar.gz.spdx.json"
          done

      - name: compute SHA256SUMS hash for SLSA
        # slsa-framework/generator_generic_slsa3 wants base64(sha256(file))
        # for each binary it covers ; we feed it the SHA256SUMS file
        # itself so a single provenance attestation covers every
        # tarball.
        id: hashes
        run: |
          set -euo pipefail
          cd stage
          # base64-encode the per-tarball sha256 lines ; the generator
          # parses them line-by-line.
          echo "hashes=$(sha256sum *.tar.gz | base64 -w0)" >>"$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: sign release artifacts (keyless)
        # Sigstore keyless: OIDC identity = GitHub Actions runner. Drops
        # a .sig + .cert next to each tarball so consumers can verify
        # with `cosign verify-blob --certificate <name>.cert --signature
        # <name>.sig --certificate-identity-regexp '...' --certificate-
        # oidc-issuer https://token.actions.githubusercontent.com`.
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd stage
          for f in *.tar.gz; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.cert" \
              "$f"
          done

      - name: cosign-attest SBOMs (spdxjson predicate)
        # Each per-tarball SBOM becomes an in-toto attestation bound
        # to the tarball's content. Consumers verify with
        # `cosign verify-blob-attestation --type spdxjson ...`.
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd stage
          for f in *.tar.gz; do
            cosign attest-blob --yes \
              --predicate "${f}.spdx.json" \
              --type spdxjson \
              --output-attestation "${f}.spdx.intoto.jsonl" \
              "$f"
          done

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            stage/*.tar.gz
            stage/*.tar.gz.sig
            stage/*.tar.gz.cert
            stage/*.spdx.json
            stage/*.spdx.intoto.jsonl
            stage/SHA256SUMS
          draft: true
          generate_release_notes: true

  provenance-tarballs:
    # SLSA L3 provenance for the tarballs ; the official reusable
    # workflow runs on an isolated, ephemeral builder GitHub controls,
    # which is what makes the attestation non-falsifiable (L3 builder
    # identity). It uploads a .intoto.jsonl alongside the assets we
    # already attached to the draft release.
    needs: release
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      draft-release: true

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    outputs:
      # Per-arch image digests surfaced so the SLSA container
      # generator can attest them in a separate matrix run.
      image-amd64: ${{ steps.expose.outputs.image-amd64 }}
      image-arm64: ${{ steps.expose.outputs.image-arm64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: weft-linux-${{ matrix.arch }}
          path: image/

      - name: chmod
        run: chmod +x image/weft

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: write Dockerfile
        run: |
          cat > image/Dockerfile <<'EOF'
          FROM gcr.io/distroless/static-debian12:nonroot
          ARG SOURCE_DATE_EPOCH
          COPY weft /usr/local/bin/weft
          ENTRYPOINT ["/usr/local/bin/weft"]
          CMD ["agent"]
          EOF

      - name: compute SOURCE_DATE_EPOCH
        id: sde
        run: |
          set -euo pipefail
          echo "epoch=$(git log -1 --format=%ct "${GITHUB_SHA}")" >>"$GITHUB_OUTPUT"

      - name: build + push per-arch image
        id: build
        uses: docker/build-push-action@v6
        env:
          # buildkit honours SOURCE_DATE_EPOCH natively (>= 0.11) by
          # rewriting layer timestamps + the image config `created`
          # field to the epoch. Combined with the deterministic
          # tarball above this gives byte-identical per-arch manifests
          # across runs (within the same buildkit version).
          SOURCE_DATE_EPOCH: ${{ steps.sde.outputs.epoch }}
        with:
          context: image
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.epoch }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:latest-${{ matrix.arch }}

      - uses: sigstore/cosign-installer@v3

      - name: sign per-arch image (keyless)
        # Sign the per-arch manifest by its content-addressed digest so
        # the signature stays bound even if a tag is later moved.
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: anchore/sbom-action/download-syft@v0

      - name: generate per-arch image SBOM (SPDX 2.3 JSON)
        # Scan the just-pushed manifest via its digest so the SBOM
        # matches the exact layers we're signing/attesting.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft scan "registry:${IMAGE}@${DIGEST}" \
            -o spdx-json=weft-image-${{ matrix.arch }}.spdx.json

      - name: cosign-attest image SBOM (spdxjson predicate)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes \
            --predicate "weft-image-${{ matrix.arch }}.spdx.json" \
            --type spdxjson \
            "${IMAGE}@${DIGEST}"

      - name: upload image SBOM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: weft-image-${{ matrix.arch }}.spdx.json
          draft: true

      - name: expose digest for SLSA
        id: expose
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Strip the leading `sha256:` ; the SLSA reusable workflow
          # wants `<repo>:<digest>` in its `digest` input but the
          # matrix output uses the bare hex form so we can rebuild
          # the ref downstream.
          echo "image-${{ matrix.arch }}=${DIGEST#sha256:}" >>"$GITHUB_OUTPUT"

  provenance-image-amd64:
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/weft
      digest: sha256:${{ needs.image.outputs.image-amd64 }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  provenance-image-arm64:
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/weft
      digest: sha256:${{ needs.image.outputs.image-arm64 }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: assemble multi-arch manifest
        id: manifest
        run: |
          set -euo pipefail
          for tag in "${{ github.ref_name }}" latest; do
            docker buildx imagetools create \
              --tag "${{ env.IMAGE }}:${tag}" \
              "${{ env.IMAGE }}:${tag}-amd64" \
              "${{ env.IMAGE }}:${tag}-arm64"
          done
          # Resolve the multi-arch index digest for the primary tag so we
          # can pin the cosign signature to the content, not the tag.
          digest=$(docker buildx imagetools inspect \
            "${{ env.IMAGE }}:${{ github.ref_name }}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: sign multi-arch manifest (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
