name: jupyter-user-image

# Builds and publishes ghcr.io/openweft/jupyter-user — the default
# OCI image for user notebook microVMs spawned by the
# catalogue/jupyterhub-ha plugin.
#
# Trigger policy: workflow_dispatch + tag `jupyter-user-v*` only,
# never push:main (per feedback_no_autopublish_dev). Modelled on
# .github/workflows/release.yml (commit 3b7593594) : same cosign
# install + sign pattern, per-arch manifest then multi-arch index.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (default: refs/tags/<current>, e.g. jupyter-user-v0.1.0)"
        required: false
  push:
    tags: ['jupyter-user-v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jupyter-user
  CONTEXT: catalogue/jupyterhub-ha/user-image

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve tag
        id: tag
        # workflow_dispatch may pass an explicit tag input ; on a
        # tag push, github.ref_name is already the tag. We strip
        # the "jupyter-user-" prefix so the published image tag
        # is the bare semver (e.g. v0.1.0).
        run: |
          set -euo pipefail
          raw="${{ inputs.tag || github.ref_name }}"
          stripped="${raw#jupyter-user-}"
          echo "raw=${raw}"           >>"$GITHUB_OUTPUT"
          echo "stripped=${stripped}" >>"$GITHUB_OUTPUT"

      - name: build + push per-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.stripped }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:latest-${{ matrix.arch }}

      - uses: sigstore/cosign-installer@v4.1.2

      - name: sign per-arch image (keyless)
        # Sigstore keyless : OIDC identity = GitHub Actions runner.
        # Sign by content-addressed digest so the signature stays
        # bound even if a tag is later moved (same pattern as
        # .github/workflows/release.yml).
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve tag
        id: tag
        run: |
          set -euo pipefail
          raw="${{ inputs.tag || github.ref_name }}"
          stripped="${raw#jupyter-user-}"
          echo "stripped=${stripped}" >>"$GITHUB_OUTPUT"

      - name: assemble multi-arch manifest
        id: manifest
        run: |
          set -euo pipefail
          for tag in "${{ steps.tag.outputs.stripped }}" latest; do
            docker buildx imagetools create \
              --tag "${IMAGE}:${tag}" \
              "${IMAGE}:${tag}-amd64" \
              "${IMAGE}:${tag}-arm64"
          done
          # Resolve the multi-arch index digest for the primary tag so
          # the cosign signature pins to the content, not the tag.
          digest=$(docker buildx imagetools inspect \
            "${IMAGE}:${{ steps.tag.outputs.stripped }}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v4.1.2

      - name: sign multi-arch manifest (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
