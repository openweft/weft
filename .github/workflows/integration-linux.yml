name: integration-linux

# Runs the //go:build linux && integration tests : they program
# real nftables tables via netlink (CAP_NET_ADMIN required) inside
# a fresh network namespace so the kernel state never leaks onto
# the runner. Push + PR scope only — no publishing, no tag gating.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  floatingipnat:
    name: floatingipnat netlink integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: kernel info
        run: |
          uname -a
          which nft || true
          nft --version || true

      - name: go test (integration)
        env:
          GOWORK: off
        # sudo -E preserves env (GOPATH, GOCACHE, PATH so go is found).
        # ubuntu-latest gives the runner full CAP_NET_ADMIN via sudo —
        # no userns/seccomp gymnastics needed.
        run: |
          sudo -E env "PATH=$PATH" go test -tags=integration -v -count=1 ./floatingipnat/

  floatingipl2:
    name: floatingipl2 macvlan + gARP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: kernel info
        run: |
          uname -a
          which tcpdump || true

      - name: go test (integration)
        env:
          GOWORK: off
        # Same CAP_NET_ADMIN need as floatingipnat — we create a fresh
        # netns, add a veth pair, program VLAN sub-interface + macvlan
        # + addresses, emit gARP via AF_PACKET, and assert the kernel
        # state. tcpdump is available on ubuntu-latest ; the wire-
        # capture test will run, the others use only netlink.
        run: |
          sudo -E env "PATH=$PATH" go test -tags=integration -v -count=1 ./floatingipl2/

  portsec:
    name: portsec bridge-nftables integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: kernel info
        run: |
          uname -a
          which nft || true
          nft --version || true

      - name: go test (integration)
        env:
          GOWORK: off
        # The portsec reconciler installs a `bridge weft-portsec`
        # table with per-tap MAC + IP source filters. The test enters
        # a fresh netns, programs the rules, then reads the table
        # back via the google/nftables API and asserts rule counts.
        run: |
          sudo -E env "PATH=$PATH" go test -tags=integration -v -count=1 ./portsec/

  portqos:
    name: portqos tc/htb + ifb integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: kernel info
        run: |
          uname -a
          which tc || true
          # Pre-load the ifb module so the reconciler's LinkAdd
          # succeeds. modprobe on ubuntu-latest works under sudo.
          sudo modprobe ifb numifbs=0 || true
          lsmod | grep -E '^(ifb|sch_htb|act_mirred|cls_u32)' || true

      - name: go test (integration)
        env:
          GOWORK: off
        # portqos drives tc/htb via netlink : root HTB on the tap for
        # egress, mirred + ifb + HTB for ingress. CAP_NET_ADMIN is
        # required ; the ifb module is loaded above so the LinkAdd
        # for "<tap>-ifb" doesn't trip on a stripped kernel.
        run: |
          sudo -E env "PATH=$PATH" go test -tags=integration -v -count=1 ./portqos/
