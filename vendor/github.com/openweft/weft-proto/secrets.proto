syntax = "proto3";

// secrets.proto defines GuestSecrets: how a micro-VM fetches a secret it is
// entitled to, by ID, over the host vsock channel, instead of receiving the
// value inside the PodSpec or on the event bus.
//
// The service is served on a dedicated guest-only gRPC server (never the
// operator API). The caller is identified by the host from the transport
// (the vsock peer CID bound at StartVM, plus the per-boot token when the
// driver provides one) and NEVER from anything in a request.
//
// A secret ID is an opaque name, not a secretsource reference: the host maps
// ID -> reference from cluster state, so a guest cannot ask the host to read
// an arbitrary source.
//
// Errors are gRPC codes with constant messages:
//   PermissionDenied   not allowed, AND no such ID (no oracle on which IDs exist)
//   Unavailable        the secret store cannot be reached
//   ResourceExhausted  rate limit
//   InvalidArgument    malformed request (bad ID syntax, bad token length)

package weft.guest.v1;

option go_package = "github.com/openweft/weft-proto/guestv1;guestv1";

service GuestSecrets {
  // Fetch returns the current value of one secret.
  rpc Fetch(FetchRequest) returns (FetchResponse);
}

message FetchRequest {
  // secret_id matches [a-z0-9][a-z0-9._-]{0,62}.
  string secret_id = 1;
  // boot_token is the 32-byte per-boot token the guest read at boot, or
  // empty when the driver provides none (KVM today relies on the CID alone).
  // When the host holds a token for the VM it must match; a request without
  // one is refused.
  bytes boot_token = 2;
  // known_version is the version the guest already holds; 0 = none. When it
  // equals the current version the host answers unchanged = true with no value.
  uint64 known_version = 3;
}

message FetchResponse {
  // value is at most 65536 bytes; empty when unchanged. The guest should
  // clear it after use.
  bytes value = 1;
  // version is the secret record's rotation counter kept by the control
  // plane; it increases each time the secret is rotated, per secret_id.
  uint64 version = 2;
  bool unchanged = 3;
}
